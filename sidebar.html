<!-- 
    COMPONENT: V9 SUPREME INDUSTRIAL SIDEBAR
    ESTADO: FULL PRODUCTION READY
    FUNÇÕES: RELÓGIO ATÔMICO, VÍDEO BG, CONTROLE DE TEMA
-->

<!-- CSS EXCLUSIVO DA SIDEBAR -->
<style>
    /* VARIÁVEIS DE CORES */
    :root {
        --v9-side-bg: #0a0a0a;
        --v9-side-accent: #ff6a00;
        --v9-side-text: #ffffff;
        --v9-side-glass: rgba(255, 255, 255, 0.03);
    }

    /* CONTAINER PRINCIPAL */
    .v9-sidebar {
        position: fixed;
        top: 0;
        right: -100%;
        width: 350px;
        max-width: 85%;
        height: 100vh;
        background: var(--v9-side-bg);
        z-index: 70000;
        transition: all 0.6s cubic-bezier(0.85, 0, 0.15, 1);
        display: flex;
        flex-direction: column;
        box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        border-left: 1px solid rgba(255,106,0,0.2);
    }

    .v9-sidebar.active {
        right: 0;
    }

    /* VÍDEO DE FUNDO */
    .v9-sidebar-video-bg {
        position: absolute;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        opacity: 0.15;
    }

    .v9-sidebar-video-bg video {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .v9-sidebar-video-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #0a0a0a 0%, transparent 50%, #0a0a0a 100%);
    }

    /* CONTEÚDO INTERNO */
    .v9-sidebar-inner {
        position: relative;
        z-index: 2;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 40px 30px;
    }

    /* HEADER */
    .v9-sidebar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 50px;
    }

    .v9-sidebar-logo {
        font-family: 'Rubik', sans-serif;
        font-weight: 900;
        font-size: 1.2rem;
        letter-spacing: 2px;
        color: var(--v9-side-text);
        border-left: 3px solid var(--v9-side-accent);
        padding-left: 15px;
    }

    .v9-sidebar-close {
        background: none;
        border: 1px solid rgba(255,255,255,0.1);
        color: white;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.3s;
    }

    .v9-sidebar-close:hover {
        background: var(--v9-side-accent);
        border-color: var(--v9-side-accent);
        transform: rotate(90deg);
    }

    /* RELÓGIO INDUSTRIAL */
    .v9-sidebar-clock-wrap {
        background: var(--v9-side-glass);
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 40px;
        border: 1px solid rgba(255,255,255,0.05);
        backdrop-filter: blur(10px);
    }

    .sidebar-time {
        font-family: 'Ubuntu', sans-serif;
        font-size: 2rem;
        font-weight: 700;
        color: var(--v9-side-accent);
        line-height: 1;
    }

    .sidebar-date {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 5px;
        opacity: 0.6;
    }

    /* MENU LINKS */
    .v9-sidebar-menu {
        list-style: none;
        padding: 0;
        margin-bottom: auto;
    }

    .v9-sidebar-menu li {
        margin-bottom: 15px;
        transform: translateX(30px);
        opacity: 0;
        transition: 0.4s cubic-bezier(0.85, 0, 0.15, 1);
    }

    .v9-sidebar.active .v9-sidebar-menu li {
        transform: translateX(0);
        opacity: 1;
    }

    /* Delay escalonado para os itens do menu */
    .v9-sidebar.active .v9-sidebar-menu li:nth-child(1) { transition-delay: 0.1s; }
    .v9-sidebar.active .v9-sidebar-menu li:nth-child(2) { transition-delay: 0.2s; }
    .v9-sidebar.active .v9-sidebar-menu li:nth-child(3) { transition-delay: 0.3s; }
    .v9-sidebar.active .v9-sidebar-menu li:nth-child(4) { transition-delay: 0.4s; }
    .v9-sidebar.active .v9-sidebar-menu li:nth-child(5) { transition-delay: 0.5s; }
    .v9-sidebar.active .v9-sidebar-menu li:nth-child(6) { transition-delay: 0.6s; }

    .v9-sidebar-menu a {
        color: white;
        text-decoration: none;
        font-family: 'Ubuntu', sans-serif;
        font-size: 1.4rem;
        font-weight: 500;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        transition: 0.3s;
    }

    .v9-sidebar-menu a:hover {
        color: var(--v9-side-accent);
        padding-left: 10px;
    }

    .v9-sidebar-menu a i {
        font-size: 0.9rem;
        opacity: 0.3;
    }

    /* BOTÃO TEMA */
    .v9-btn-sidebar-theme {
        width: 100%;
        padding: 15px;
        background: transparent;
        border: 1px solid rgba(255,255,255,0.1);
        color: white;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: 0.3s;
    }

    .v9-btn-sidebar-theme:hover {
        background: white;
        color: black;
    }

    /* FOOTER SIDEBAR */
    .v9-sidebar-footer {
        margin-top: 30px;
        padding-top: 30px;
        border-top: 1px solid rgba(255,255,255,0.05);
    }

    .v9-sidebar-contact p {
        font-size: 0.9rem;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .v9-sidebar-contact i {
        color: var(--v9-side-accent);
    }

    .v9-sidebar-socials {
        display: flex;
        gap: 15px;
        margin-top: 20px;
    }

    .v9-sidebar-socials a {
        width: 40px;
        height: 40px;
        background: var(--v9-side-glass);
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        color: white;
        text-decoration: none;
        transition: 0.3s;
    }

    .v9-sidebar-socials a:hover {
        background: var(--v9-side-accent);
        transform: translateY(-3px);
    }

    /* OVERLAY */
    .v9-sidebar-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(5px);
        z-index: 65000;
        opacity: 0;
        visibility: hidden;
        transition: 0.4s;
    }

    .v9-sidebar-overlay.active {
        opacity: 1;
        visibility: visible;
    }
</style>

<!-- LÓGICA JAVASCRIPT -->
<script>
    (function() {
        const sidebar = document.getElementById('v9Sidebar');
        const overlay = document.getElementById('v9Overlay');
        const openBtn = document.getElementById('v9SidebarOpen'); // Referência do index.html
        const closeBtn = document.getElementById('v9SidebarClose');
        const themeBtn = document.getElementById('sidebarThemeToggle');
        
        // 1. FUNÇÃO ABRIR/FECHAR
        const toggleSidebar = () => {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
            document.body.style.overflow = sidebar.classList.contains('active') ? 'hidden' : '';
        };

        if(openBtn) openBtn.addEventListener('click', toggleSidebar);
        if(closeBtn) closeBtn.addEventListener('click', toggleSidebar);
        if(overlay) overlay.addEventListener('click', toggleSidebar);

        // Fechar ao clicar em um link
        const navLinks = sidebar.querySelectorAll('.v9-sidebar-menu a');
        navLinks.forEach(link => {
            link.addEventListener('click', toggleSidebar);
        });

        // 2. RELÓGIO ATÔMICO
        function updateClock() {
            const now = new Date();
            const timeEl = document.getElementById('sidebarTime');
            const dateEl = document.getElementById('sidebarDate');
            
            if(timeEl) timeEl.textContent = now.toLocaleTimeString('pt-BR');
            if(dateEl) {
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                dateEl.textContent = now.toLocaleDateString('pt-BR', options).toUpperCase();
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 3. ALTERNAR TEMA
        if(themeBtn) {
            themeBtn.addEventListener('click', () => {
                const html = document.documentElement;
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('v9_theme', newTheme);
                
                // Sincroniza classes no body se necessário
                document.body.classList.remove('dark-mode', 'light-mode');
                document.body.classList.add(newTheme + '-mode');
            });
        }
    })();
</script>
